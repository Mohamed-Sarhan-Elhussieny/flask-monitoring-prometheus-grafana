
services:
  web:
    build: .
    image: urlapp:1.0
    ports:
      - "5000:5000"
    volumes:
      - .:/usr/local/app

  prometheus:
    container_name: prometheus
    image: prom/prometheus:v3.13.4
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    container_name: grafana
    image: grafana/grafana:latest
    volumes:
      - ./grafana.yml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./url-shortener-dashboard.json:/var/lib/grafana/dashboards/url-shortener.json
    ports:
      - "3000:3000"
